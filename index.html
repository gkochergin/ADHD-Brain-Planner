    </main>
  </div>


  <!-- Shows up when you drag a file onto the page -->
  <div id="drop-overlay">
    <div class="drop-box">
      <span class="drop-title">Drop to import</span>
      <span class="drop-subtitle">A .json file of tasks</span>
    </div>
  </div>

  <!-- Little message that pops up at the bottom of the screen -->
  <div id="popup-message"></div>


  <script>
    // =========================================================
    // SETTINGS
    // Change these numbers to change how the calendar looks.
    // =========================================================
    const FIRST_HOUR = 6;         // the calendar starts at 6 AM
    const LAST_HOUR = 23;         // the calendar ends at 11 PM
    const PIXELS_PER_HOUR = 60;   // how tall one hour is on the screen
    const SNAP_MINUTES = 15;      // when you drag, times jump in 15 minute steps

    // The name used to save your data in the browser.
    // Don't change this, or your old saved tasks won't load anymore.
    const SAVE_KEY = 'planner.v1';

    // The colors you can pick for a task
    const COLORS = {
      blue: '#6f9bf0',
      green: '#5fc2a0',
      amber: '#dfa055',
      rose: '#d97a90',
      purple: '#a98ada',
      slate: '#7e828c'
    };

    // Short names for the days of the week. getDay() gives 0 for Sunday, 1 for Monday, and so on.
    const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // True if the person turned on "reduce motion" on their computer
    const WANTS_LESS_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;


    // =========================================================
    // THE APP'S DATA
    //
    // Everything the app needs to remember is in this one object.
    // It gets saved to the browser every time something changes.
    //
    // A task looks like this:
    //   { id: 'abc123', title: 'Gym', duration: 60, color: 'green' }
    // It can also have:
    //   done: true                  -> the task is checked off
    //   due: '2026-10-01'           -> a due date (only comes from imported files)
    //   repeat: { days: ['mon', 'wed'], at: '10:00' }
    //                               -> the task shows up every Monday and Wednesday at 10 AM
    //
    // A block is a task that was dragged onto the calendar:
    //   { id: 'xyz789', taskId: 'abc123', date: '2026-09-28', start: 540, dur: 60 }
    //   start is minutes after midnight (540 = 9:00 AM), dur is how many minutes it lasts
    //
    // overrides are changes to ONE day of a repeating task. The key is "taskId|date":
    //   'abc123|2026-09-28': { start: 600, dur: 30 }   -> moved to 10 AM on that day
    //   'abc123|2026-09-29': { deleted: true }         -> removed from that day
    // =========================================================
    let appData = {
      tasks: [],
      blocks: [],
      overrides: {},
      currentDate: '',  // the date you are looking at, like '2026-09-28'
      view: 'week'      // 'day', 'week' or 'month'
    };

    let selectedColor = 'blue';   // the color picked in the "add task" form
    let savingWorks = true;       // becomes false if the browser won't let us save


    // =========================================================
    // DATE HELPERS
    // Dates are stored as text like '2026-09-28' because that is
    // easy to save and easy to compare.
    // =========================================================

    // Turns a Date into text like '2026-09-28'
    function dateToText(date) {
      let year = date.getFullYear();
      let month = date.getMonth() + 1; // getMonth() starts at 0 for January, so add 1
      let day = date.getDate();

      // Add a 0 in front of single numbers, so 9 becomes 09
      if (month < 10) {
        month = '0' + month;
      }
      if (day < 10) {
        day = '0' + day;
      }

      return year + '-' + month + '-' + day;
    }

    // Turns text like '2026-09-28' back into a Date
    function textToDate(text) {
      let parts = text.split('-');
      let year = Number(parts[0]);
      let month = Number(parts[1]) - 1; // Date wants 0 for January
      let day = Number(parts[2]);
      return new Date(year, month, day);
    }

    // Today's date as text
    function getTodayText() {
      return dateToText(new Date());
    }

    // addDaysToDate('2026-09-28', 3) gives '2026-10-01'. Use a negative number to go back.
    function addDaysToDate(dateText, numberOfDays) {
      let date = textToDate(dateText);
      date.setDate(date.getDate() + numberOfDays);
      return dateToText(date);
    }

    // Weeks start on Sunday. This finds the Sunday at the start of the week.
    function getWeekStart(dateText) {
      let date = textToDate(dateText);
      let daysSinceSunday = date.getDay(); // 0 = Sunday, 1 = Monday, ...
      return addDaysToDate(dateText, -daysSinceSunday);
    }

    // The dates shown in day view (1 date) or week view (7 dates)
    function getVisibleDays() {
      if (appData.view === 'day') {
        return [appData.currentDate];
      }

      let days = [];
      let sunday = getWeekStart(appData.currentDate);
      for (let i = 0; i < 7; i++) {
        days.push(addDaysToDate(sunday, i));
      }
      return days;
    }

    // All the dates shown in the month view.
    // This includes a few days from the month before and after, so every row is a full week.
    function getMonthDays(dateText) {
      let date = textToDate(dateText);
      let year = date.getFullYear();
      let month = date.getMonth();

      let firstOfMonth = dateToText(new Date(year, month, 1));
      let lastOfMonth = dateToText(new Date(year, month + 1, 0)); // day 0 of next month = last day of this month

      let gridStart = getWeekStart(firstOfMonth);                // the Sunday on or before the 1st
      let gridEnd = addDaysToDate(getWeekStart(lastOfMonth), 6); // the Saturday on or after the last day

      let days = [];
      let day = gridStart;
      // Text dates like '2026-09-28' can be compared with < and >
      while (day <= gridEnd) {
        days.push(day);
        day = addDaysToDate(day, 1);
      }
      return days;
    }


    // =========================================================
    // TIME AND TEXT HELPERS
    // Times are stored as "minutes after midnight".
    // For example 0 = 12:00 AM, 540 = 9:00 AM, 810 = 1:30 PM.
    // =========================================================

    // 570 -> '9:30 AM'
    function minutesToTime(totalMinutes) {
      let hours = Math.floor(totalMinutes / 60);
      let minutes = totalMinutes % 60;

      let amOrPm = 'AM';
      if (hours >= 12) {
        amOrPm = 'PM';
      }

      let hour12 = hours % 12;
      if (hour12 === 0) {
        hour12 = 12;
      }

      let minutesText = String(minutes);
      if (minutes < 10) {
        minutesText = '0' + minutes;
      }

      return hour12 + ':' + minutesText + ' ' + amOrPm;
    }

    // Shorter version for small spaces. 570 -> '9:30' and 540 -> '9'
    function minutesToShortTime(totalMinutes) {
      let hours = Math.floor(totalMinutes / 60);
      let minutes = totalMinutes % 60;

      let hour12 = hours % 12;
      if (hour12 === 0) {
        hour12 = 12;
      }

      if (minutes === 0) {
        return String(hour12);
      }

      let minutesText = String(minutes);
      if (minutes < 10) {
        minutesText = '0' + minutes;
      }
      return hour12 + ':' + minutesText;
    }

    // The time range shown on a block.
    // Week view is narrow, so it uses the short version.
    function timeRangeText(start, duration, dayCount) {
      let end = start + duration;
      if (dayCount > 3) {
        return minutesToShortTime(start) + '–' + minutesToShortTime(end);
      } else {
        return minutesToTime(start) + ' – ' + minutesToTime(end);
      }
    }

    // Labels for the left side of the calendar. 13 -> '1p'
    function hourLabelText(hour) {
      let amOrPm = 'a';
      if (hour >= 12) {
        amOrPm = 'p';
      }

      let hour12 = hour % 12;
      if (hour12 === 0) {
        hour12 = 12;
      }
      return hour12 + amOrPm;
    }

    // 45 -> '45m', 60 -> '1h', 90 -> '1h 30m'
    function durationText(totalMinutes) {
      if (totalMinutes < 60) {
        return totalMinutes + 'm';
      }

      let hours = Math.floor(totalMinutes / 60);
      let minutes = totalMinutes % 60;

      if (minutes === 0) {
        return hours + 'h';
      }
      return hours + 'h ' + minutes + 'm';
    }

    // '09:30' -> 570
    function timeTextToMinutes(timeText) {
      let parts = String(timeText || '').split(':');
      let hours = Number(parts[0]) || 0;   // "|| 0" means use 0 if it isn't a number
      let minutes = Number(parts[1]) || 0;
      return hours * 60 + minutes;
    }

    // Rounds minutes to the nearest 15 (or whatever SNAP_MINUTES is)
    function roundToSnap(minutes) {
      return Math.round(minutes / SNAP_MINUTES) * SNAP_MINUTES;
    }

    // Makes sure a number is not smaller than min and not bigger than max
    function keepBetween(value, min, max) {
      if (value < min) {
        return min;
      }
      if (value > max) {
        return max;
      }
      return value;
    }

    // Makes a random id like 'k3j9x0ab' so every task and block has its own name
    function makeId() {
      return Math.random().toString(36).slice(2, 10);
    }


    // =========================================================
    // COLOR HELPERS
    // =========================================================

    // True if the name is one of our colors, like 'blue'
    function isKnownColor(colorName) {
      return Object.keys(COLORS).includes(colorName);
    }

    // The hex color for a task. Uses gray if the task has a color we don't know.
    function getTaskColor(task) {
      if (isKnownColor(task.color)) {
        return COLORS[task.color];
      }
      return COLORS.slate;
    }

    // Makes a see-through version of a color.
    // colorWithOpacity('#6f9bf0', 0.5) -> 'rgba(111, 155, 240, 0.5)'
    function colorWithOpacity(hexColor, opacity) {
      // Hex colors are 3 pairs: red, green, blue. parseInt(..., 16) reads a hex number.
      let red = parseInt(hexColor.substring(1, 3), 16);
      let green = parseInt(hexColor.substring(3, 5), 16);
      let blue = parseInt(hexColor.substring(5, 7), 16);
      return 'rgba(' + red + ', ' + green + ', ' + blue + ', ' + opacity + ')';
    }


    // =========================================================
    // SAVING AND LOADING
    // localStorage is a small storage space in the browser.
    // It only holds text, so we turn our data into JSON text.
    // =========================================================
    function saveData() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(appData));
      } catch (error) {
        // Some previews don't allow saving. The app still works, it just forgets on reload.
        savingWorks = false;
      }
    }

    function loadSavedData() {
      try {
        let savedText = localStorage.getItem(SAVE_KEY);
        if (savedText) {
          return JSON.parse(savedText);
        }
      } catch (error) {
        savingWorks = false;
      }
      return null;
    }


    // =========================================================
    // POPUP MESSAGE
    // =========================================================
    let popupTimer = null;

    function showMessage(text) {
      let popup = document.getElementById('popup-message');
      popup.textContent = text;
      popup.classList.add('visible');

      // Hide it again after 2.6 seconds
      clearTimeout(popupTimer);
      popupTimer = setTimeout(function () {
        popup.classList.remove('visible');
      }, 2600);
    }


    // =========================================================
    // FINDING THINGS IN THE DATA
    // =========================================================
    function findTask(taskId) {
      for (let i = 0; i < appData.tasks.length; i++) {
        if (appData.tasks[i].id === taskId) {
          return appData.tasks[i];
        }
      }
      return null;
    }

    function findBlock(blockId) {
      for (let i = 0; i < appData.blocks.length; i++) {
        if (appData.blocks[i].id === blockId) {
          return appData.blocks[i];
        }
      }
      return null;
    }

    // The name used in appData.overrides for one day of a repeating task
    function overrideKey(taskId, dateText) {
      return taskId + '|' + dateText;
    }

    // Does this repeating task show up on this date?
    function repeatsOnDate(task, dateText) {
      if (!task.repeat) {
        return false;
      }

      // Some imported tasks have a start date ("from") or end date ("until")
      if (task.repeat.from && dateText < task.repeat.from) {
        return false;
      }
      if (task.repeat.until && dateText > task.repeat.until) {
        return false;
      }

      let weekday = DAY_KEYS[textToDate(dateText).getDay()]; // like 'mon'
      let repeatDays = task.repeat.days || [];
      return repeatDays.includes(weekday);
    }


    // =========================================================
    // WHAT IS ON THE CALENDAR FOR A DAY
    //
    // This gives back a list of "items" for one date. An item is
    // everything needed to draw one box on the calendar:
    //   {
    //     isRepeating: false,     -> true if it came from a repeating task
    //     blockId: 'xyz789',      -> only for items that are NOT repeating
    //     task: (the task),
    //     date: '2026-09-28',
    //     start: 540,
    //     dur: 60
    //   }
    // =========================================================
    function getItemsForDate(dateText) {
      let items = [];

      // 1. Tasks that were dragged onto this date
      for (let i = 0; i < appData.blocks.length; i++) {
        let block = appData.blocks[i];
        if (block.date !== dateText) {
          continue;
        }

        let task = findTask(block.taskId);
        if (!task) {
          continue; // the task was deleted
        }

        items.push({
          isRepeating: false,
          blockId: block.id,
          task: task,
          date: dateText,
          start: block.start,
          dur: block.dur
        });
      }

      // 2. Repeating tasks that land on this date
      for (let i = 0; i < appData.tasks.length; i++) {
        let task = appData.tasks[i];
        if (!repeatsOnDate(task, dateText)) {
          continue;
        }

        // Check if this one day was changed or removed
        let change = appData.overrides[overrideKey(task.id, dateText)];
        if (change && change.deleted) {
          continue;
        }

        let start = timeTextToMinutes(task.repeat.at);
        let dur = task.duration;
        if (change) {
          start = change.start;
          dur = change.dur;
        }

        items.push({
          isRepeating: true,
          task: task,
          date: dateText,
          start: start,
          dur: dur
        });
      }

      return items;
    }


    // =========================================================
    // SIDE-BY-SIDE LAYOUT FOR OVERLAPPING ITEMS
    //
    // If two items happen at the same time, they sit next to each
    // other instead of on top of each other. This adds two things
    // to each item:
    //   item.column      -> which slot it goes in (0 is the left-most)
    //   item.columnCount -> how many slots the space is split into
    // =========================================================
    function arrangeOverlaps(items) {
      // Sort by start time. If two start at the same time, the longer one goes first.
      items.sort(function (a, b) {
        if (a.start !== b.start) {
          return a.start - b.start;
        }
        return b.dur - a.dur;
      });

      // Step 1: split the items into groups that overlap each other
      let groups = [];
      let currentGroup = [];
      let groupEndTime = -1;

      for (let item of items) {
        // If this item starts after everything in the group has ended, start a new group
        if (currentGroup.length > 0 && item.start >= groupEndTime) {
          groups.push(currentGroup);
          currentGroup = [];
          groupEndTime = -1;
        }

        currentGroup.push(item);
        groupEndTime = Math.max(groupEndTime, item.start + item.dur);
      }
      if (currentGroup.length > 0) {
        groups.push(currentGroup);
      }

      // Step 2: in each group, put every item in the first slot that is free
      for (let group of groups) {
        let slotFreeAt = []; // the time when each slot becomes free again

        for (let item of group) {
          let foundSlot = false;

          for (let slot = 0; slot < slotFreeAt.length; slot++) {
            if (item.start >= slotFreeAt[slot]) {
              item.column = slot;
              slotFreeAt[slot] = item.start + item.dur;
              foundSlot = true;
              break;
            }
          }

          // No free slot, so make a new one
          if (!foundSlot) {
            item.column = slotFreeAt.length;
            slotFreeAt.push(item.start + item.dur);
          }
        }

        for (let item of group) {
          item.columnCount = slotFreeAt.length;
        }
      }

      return items;
    }


    // =========================================================
    // CHANGING THE DATA
    // =========================================================

    // Put a task on the calendar
    function placeTask(task, dateText, startMinutes) {
      appData.blocks.push({
        id: makeId(),
        taskId: task.id,
        date: dateText,
        start: startMinutes,
        dur: task.duration
      });
      saveData();
      showEverything();
    }

    // Save a new time, length or date for an item after it was dragged
    function saveItemChange(item, newStart, newDur, newDate) {
      if (!item.isRepeating) {
        // A normal block: just update it
        let block = findBlock(item.blockId);
        if (block) {
          block.start = newStart;
          block.dur = newDur;
          block.date = newDate;
        }
      } else if (newDate === item.date) {
        // A repeating task moved on the same day: remember the new time for just this day
        appData.overrides[overrideKey(item.task.id, item.date)] = { start: newStart, dur: newDur };
      } else {
        // A repeating task moved to another day:
        // hide it on the old day and put a normal block on the new day
        appData.overrides[overrideKey(item.task.id, item.date)] = { deleted: true };
        appData.blocks.push({
          id: makeId(),
          taskId: item.task.id,
          date: newDate,
          start: newStart,
          dur: newDur
        });
      }
      saveData();
    }

    // Take an item off the calendar (the task stays in the sidebar)
    function removeItem(item) {
      if (!item.isRepeating) {
        let blocksToKeep = [];
        for (let block of appData.blocks) {
          if (block.id !== item.blockId) {
            blocksToKeep.push(block);
          }
        }
        appData.blocks = blocksToKeep;
      } else {
        // For repeating tasks, only hide it on this one day
        appData.overrides[overrideKey(item.task.id, item.date)] = { deleted: true };
      }
      saveData();
      showEverything();
    }

    // Delete a task completely, including everywhere it was placed on the calendar
    function deleteTask(taskId) {
      let tasksToKeep = [];
      for (let task of appData.tasks) {
        if (task.id !== taskId) {
          tasksToKeep.push(task);
        }
      }
      appData.tasks = tasksToKeep;

      let blocksToKeep = [];
      for (let block of appData.blocks) {
        if (block.taskId !== taskId) {
          blocksToKeep.push(block);
        }
      }
      appData.blocks = blocksToKeep;

      // Remove any one-day changes for this task
      for (let key of Object.keys(appData.overrides)) {
        if (key.startsWith(taskId + '|')) {
          delete appData.overrides[key];
        }
      }

      saveData();
      showEverything();
    }

    // Finds a time for a task dropped on a day in month view.
    // It goes right after the last thing that day, or at 9 AM if the day is empty.
    function findFreeTime(dateText, duration) {
      let items = getItemsForDate(dateText);
      let time = 9 * 60;

      if (items.length > 0) {
        time = 0;
        for (let item of items) {
          let endTime = item.start + item.dur;
          if (endTime > time) {
            time = endTime;
          }
        }
      }

      time = roundToSnap(time);
      return keepBetween(time, FIRST_HOUR * 60, LAST_HOUR * 60 - duration);
    }


    // =========================================================
    // SMALL DRAWING HELPERS
    // =========================================================

    // Marks a button as on or off. The CSS uses aria-pressed to style it,
    // and screen readers use it to tell people which button is on.
    function setButtonSelected(button, isSelected) {
      if (isSelected) {
        button.setAttribute('aria-pressed', 'true');
      } else {
        button.setAttribute('aria-pressed', 'false');
      }
    }

    // How far down the calendar a time is, in pixels
    function timeToPixels(minutes) {
      let minutesSinceTop = minutes - FIRST_HOUR * 60;
      return minutesSinceTop / 60 * PIXELS_PER_HOUR;
    }

    // How tall a block should be, in pixels
    function durationToPixels(minutes) {
      return minutes / 60 * PIXELS_PER_HOUR;
    }


    // =========================================================
    // DRAW EVERYTHING
    // Call this any time the data changes.
    // =========================================================
    function showEverything() {
      showHeader();
      showTaskList();

      let timeView = document.getElementById('time-view');
      let monthView = document.getElementById('month-view');

      if (appData.view === 'month') {
        timeView.style.display = 'none';
        monthView.style.display = 'flex';
        showMonthView();
      } else {
        timeView.style.display = 'flex';
        monthView.style.display = 'none';
        showTimeView();
      }
    }


    // =========================================================
    // HEADER
    // =========================================================
    function showHeader() {
      let label = document.getElementById('date-label');
      let sublabel = document.getElementById('date-sublabel');
      let current = textToDate(appData.currentDate);
      let todayText = getTodayText();

      if (appData.view === 'day') {
        // Example: "Monday, September 28"
        label.textContent = current.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

        let oneDay = 1000 * 60 * 60 * 24; // one day in milliseconds
        let daysAway = Math.round((current - textToDate(todayText)) / oneDay);

        if (daysAway === 0) {
          sublabel.textContent = 'Today';
        } else if (daysAway === 1) {
          sublabel.textContent = 'Tomorrow';
        } else if (daysAway === -1) {
          sublabel.textContent = 'Yesterday';
        } else {
          sublabel.textContent = current.getFullYear();
        }

      } else if (appData.view === 'week') {
        let weekStart = getWeekStart(appData.currentDate);
        let firstDay = textToDate(weekStart);
        let lastDay = textToDate(addDaysToDate(weekStart, 6));

        // Example: "Sep 27 – Oct 3", or "Sep 6 – 12" if it's all in one month
        let firstText = firstDay.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        let lastText;
        if (firstDay.getMonth() === lastDay.getMonth()) {
          lastText = lastDay.toLocaleDateString(undefined, { day: 'numeric' });
        } else {
          lastText = lastDay.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }
        label.textContent = firstText + ' – ' + lastText;

        if (getWeekStart(todayText) === weekStart) {
          sublabel.textContent = 'This week';
        } else {
          sublabel.textContent = lastDay.getFullYear();
        }

      } else {
        // Month view. Example: "September 2026"
        label.textContent = current.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

        let now = new Date();
        if (now.getMonth() === current.getMonth() && now.getFullYear() === current.getFullYear()) {
          sublabel.textContent = 'This month';
        } else {
          sublabel.textContent = '';
        }
      }

      // Highlight the button for the view we are in
      setButtonSelected(document.getElementById('day-view-button'), appData.view === 'day');
      setButtonSelected(document.getElementById('week-view-button'), appData.view === 'week');
      setButtonSelected(document.getElementById('month-view-button'), appData.view === 'month');
    }


    // =========================================================
    // SIDEBAR TASK LIST
    // =========================================================
    function showTaskList() {
      let list = document.getElementById('task-list');
      list.innerHTML = ''; // clear the old list

      // Split the tasks into normal ones and repeating ones.
      // Normal tasks that are done go at the bottom.
      let notDoneTasks = [];
      let doneTasks = [];
      let repeatingTasks = [];

      for (let task of appData.tasks) {
        if (task.repeat) {
          repeatingTasks.push(task);
        } else if (task.done) {
          doneTasks.push(task);
        } else {
          notDoneTasks.push(task);
        }
      }
      let normalTasks = notDoneTasks.concat(doneTasks);

      addListSection(list, 'Tasks', normalTasks, 'Add a task above, or drop in a .json file to bring in a whole batch.');
      addListSection(list, 'Repeating', repeatingTasks, 'Nothing repeating yet.');
    }

    // Adds a heading and its tasks to the sidebar list
    function addListSection(list, headingText, tasks, emptyText) {
      let heading = document.createElement('div');
      heading.className = 'list-heading';

      let name = document.createElement('span');
      name.textContent = headingText;

      let count = document.createElement('span');
      count.className = 'list-count';
      if (tasks.length > 0) {
        count.textContent = tasks.length;
      }

      heading.appendChild(name);
      heading.appendChild(count);
      list.appendChild(heading);

      if (tasks.length === 0) {
        let empty = document.createElement('div');
        empty.className = 'empty-message';
        empty.textContent = emptyText;
        list.appendChild(empty);
        return;
      }

      for (let task of tasks) {
        list.appendChild(makeTaskCard(task));
      }
    }

    // Builds one task card for the sidebar.
    // We use textContent (not innerHTML) for the title so any odd characters show up safely as text.
    function makeTaskCard(task) {
      let card = document.createElement('div');
      card.className = 'task-card';
      if (task.done) {
        card.classList.add('done');
      }

      // Colored dot
      let dot = document.createElement('span');
      dot.className = 'task-dot';
      dot.style.background = getTaskColor(task);

      // Title and details
      let info = document.createElement('div');
      info.className = 'task-info';

      let title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = task.title;

      let details = document.createElement('div');
      details.className = 'task-details';
      details.textContent = getTaskDetailsText(task);

      info.appendChild(title);
      info.appendChild(details);

      // ✓ and × buttons
      let buttons = document.createElement('div');
      buttons.className = 'task-buttons';

      // Only normal tasks can be checked off
      if (!task.repeat) {
        let doneButton = document.createElement('button');
        doneButton.textContent = '✓';
        if (task.done) {
          doneButton.title = 'Mark not done';
        } else {
          doneButton.title = 'Mark done';
        }
        doneButton.addEventListener('click', function () {
          task.done = !task.done; // flip true to false, or false to true
          saveData();
          showEverything();
        });
        buttons.appendChild(doneButton);
      }

      let deleteButton = document.createElement('button');
      deleteButton.textContent = '×';
      deleteButton.title = 'Delete task';
      deleteButton.addEventListener('click', function () {
        deleteTask(task.id);
      });
      buttons.appendChild(deleteButton);

      card.appendChild(dot);
      card.appendChild(info);
      card.appendChild(buttons);

      // Pressing down on the card starts dragging it to the calendar
      card.addEventListener('pointerdown', function (event) {
        startDraggingTask(event, task, card);
      });

      return card;
    }

    // The small gray text under a task title.
    // Examples: "1h", "45m · due Oct 3", "1h · Mon Wed Fri at 10:00 AM"
    function getTaskDetailsText(task) {
      let text = durationText(task.duration);

      if (task.repeat) {
        let dayNames = [];
        let repeatDays = task.repeat.days || [];
        for (let day of repeatDays) {
          // 'mon' -> 'Mon'
          dayNames.push(day.charAt(0).toUpperCase() + day.slice(1, 3));
        }
        text = text + ' · ' + dayNames.join(' ') + ' at ' + minutesToTime(timeTextToMinutes(task.repeat.at));
      } else if (task.due) {
        let dueDate = textToDate(task.due);
        text = text + ' · due ' + dueDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      return text;
    }


    // =========================================================
    // DAY AND WEEK VIEW
    // =========================================================
    function showTimeView() {
      let days = getVisibleDays();
      let dayCount = days.length; // 1 for day view, 7 for week view
      let todayText = getTodayText();

      // ----- Day names across the top (only in week view) -----
      let dayHeaders = document.getElementById('day-headers');
      dayHeaders.innerHTML = '';

      if (dayCount === 1) {
        dayHeaders.style.display = 'none';
      } else {
        dayHeaders.style.display = 'flex';
        for (let dateText of days) {
          dayHeaders.appendChild(makeDayHeader(dateText, todayText));
        }
      }

      // ----- Clear the grid -----
      let hourLabels = document.getElementById('hour-labels');
      let columns = document.getElementById('day-columns');
      hourLabels.innerHTML = '';
      columns.innerHTML = '';

      // Make the grid tall enough for all the hours (+20px so the last label isn't cut off)
      let gridHeight = (LAST_HOUR - FIRST_HOUR) * PIXELS_PER_HOUR + 20;
      document.getElementById('time-grid').style.height = gridHeight + 'px';

      // ----- Hour labels and lines -----
      for (let hour = FIRST_HOUR; hour <= LAST_HOUR; hour++) {
        let top = (hour - FIRST_HOUR) * PIXELS_PER_HOUR;

        let label = document.createElement('div');
        label.className = 'hour-label';
        label.style.top = top + 'px';
        label.textContent = hourLabelText(hour);
        hourLabels.appendChild(label);

        let line = document.createElement('div');
        line.className = 'hour-line';
        line.style.top = top + 'px';
        columns.appendChild(line);

        // Half-hour line (not after the last hour)
        if (hour < LAST_HOUR) {
          let halfLine = document.createElement('div');
          halfLine.className = 'hour-line half-hour';
          halfLine.style.top = (top + PIXELS_PER_HOUR / 2) + 'px';
          columns.appendChild(halfLine);
        }
      }

      // ----- Lines between the days -----
      for (let i = 1; i < dayCount; i++) {
        let divider = document.createElement('div');
        divider.className = 'day-divider';
        divider.style.left = (i * 100 / dayCount) + '%';
        columns.appendChild(divider);
      }

      // ----- Red line for the current time -----
      let todayIndex = days.indexOf(todayText); // -1 if today isn't on screen
      if (todayIndex !== -1) {
        let now = new Date();
        let nowMinutes = now.getHours() * 60 + now.getMinutes();

        if (nowMinutes >= FIRST_HOUR * 60 && nowMinutes <= LAST_HOUR * 60) {
          let nowLine = document.createElement('div');
          nowLine.id = 'now-line';
          nowLine.style.top = timeToPixels(nowMinutes) + 'px';
          nowLine.style.left = (todayIndex * 100 / dayCount) + '%';
          nowLine.style.width = (100 / dayCount) + '%';
          columns.appendChild(nowLine);
        }
      }

      // ----- The task blocks -----
      for (let dayIndex = 0; dayIndex < dayCount; dayIndex++) {
        let items = getItemsForDate(days[dayIndex]);
        arrangeOverlaps(items);

        for (let item of items) {
          item.dayIndex = dayIndex; // which column (day) it is in
          columns.appendChild(makeBlockElement(item, dayCount));
        }
      }
    }

    // One day name at the top of week view. Clicking it opens that day.
    function makeDayHeader(dateText, todayText) {
      let date = textToDate(dateText);

      let header = document.createElement('div');
      header.className = 'day-header';
      if (dateText === todayText) {
        header.classList.add('today');
      }

      let name = document.createElement('div');
      name.className = 'day-name';
      name.textContent = DAY_NAMES[date.getDay()];

      let number = document.createElement('div');
      number.className = 'day-number';
      number.textContent = date.getDate();

      header.appendChild(name);
      header.appendChild(number);

      header.addEventListener('click', function () {
        appData.currentDate = dateText;
        appData.view = 'day';
        saveData();
        showEverything();
      });

      return header;
    }

    // Sets how far from the left a block is and how wide it is
    function setBlockSideways(element, item, dayCount) {
      let dayWidth = 100 / dayCount;                  // width of one day, in %
      let width = dayWidth / item.columnCount;        // split it if things overlap
      let left = item.dayIndex * dayWidth + item.column * width;

      // The +3px and -6px leave a small gap on each side
      element.style.left = 'calc(' + left + '% + 3px)';
      element.style.width = 'calc(' + width + '% - 6px)';
    }

    // Sets how far down a block is, how tall it is, and its time text
    function setBlockTimes(element, start, dur, dayCount) {
      let height = durationToPixels(dur);

      element.style.top = timeToPixels(start) + 'px';
      element.style.height = Math.max(height, 18) + 'px'; // never smaller than 18px

      // Blocks under 32px tall put everything on one line
      if (height < 32) {
        element.classList.add('short');
      } else {
        element.classList.remove('short');
      }

      element.querySelector('.block-time').textContent = timeRangeText(start, dur, dayCount);
    }

    // Builds one block on the calendar
    function makeBlockElement(item, dayCount) {
      let color = getTaskColor(item.task);

      let block = document.createElement('div');
      block.className = 'block';
      block.style.background = colorWithOpacity(color, 0.16);
      block.style.borderColor = colorWithOpacity(color, 0.34);
      block.style.borderLeftColor = color;

      let title = document.createElement('div');
      title.className = 'block-title';
      title.textContent = item.task.title;

      let time = document.createElement('div');
      time.className = 'block-time';

      block.appendChild(title);
      block.appendChild(time);

      // Invisible strips at the top and bottom for resizing
      let topHandle = document.createElement('div');
      topHandle.className = 'resize-handle top';
      let bottomHandle = document.createElement('div');
      bottomHandle.className = 'resize-handle bottom';
      block.appendChild(topHandle);
      block.appendChild(bottomHandle);

      // × button
      let deleteButton = document.createElement('button');
      deleteButton.className = 'block-delete';
      deleteButton.textContent = '×';
      deleteButton.title = 'Remove from day';
      deleteButton.addEventListener('click', function () {
        removeItem(item);
      });
      block.appendChild(deleteButton);

      // Put it in the right spot (this also fills in the time text)
      setBlockSideways(block, item, dayCount);
      setBlockTimes(block, item.start, item.dur, dayCount);

      // Dragging
      topHandle.addEventListener('pointerdown', function (event) {
        startDraggingBlock(event, item, block, 'resize-top', dayCount);
      });
      bottomHandle.addEventListener('pointerdown', function (event) {
        startDraggingBlock(event, item, block, 'resize-bottom', dayCount);
      });
      block.addEventListener('pointerdown', function (event) {
        // The handles and the × button have their own jobs, so ignore them here
        if (event.target === topHandle || event.target === bottomHandle || event.target === deleteButton) {
          return;
        }
        startDraggingBlock(event, item, block, 'move', dayCount);
      });

      return block;
    }


    // =========================================================
    // MONTH VIEW
    // =========================================================
    function showMonthView() {
      let grid = document.getElementById('month-grid');
      let days = getMonthDays(appData.currentDate);
      let rowCount = days.length / 7;
      let currentMonth = textToDate(appData.currentDate).getMonth();
      let todayText = getTodayText();

      // Some months need 5 rows and some need 6
      grid.style.gridTemplateRows = 'repeat(' + rowCount + ', minmax(0, 1fr))';
      grid.innerHTML = '';

      for (let dateText of days) {
        grid.appendChild(makeMonthCell(dateText, currentMonth, todayText));
      }

      // Wait until the browser has drawn the boxes, then measure them
      // and hide the tasks that don't fit.
      requestAnimationFrame(hideTasksThatDontFit);
    }

    // One day box in month view
    function makeMonthCell(dateText, currentMonth, todayText) {
      let date = textToDate(dateText);

      let cell = document.createElement('div');
      cell.className = 'month-cell';
      if (date.getMonth() !== currentMonth) {
        cell.classList.add('other-month');
      }
      if (dateText === todayText) {
        cell.classList.add('today');
      }
      // Save the date on the box so we know which day a task was dropped on
      cell.dataset.date = dateText;

      let number = document.createElement('div');
      number.className = 'month-day-number';
      number.textContent = date.getDate();

      let taskArea = document.createElement('div');
      taskArea.className = 'month-cell-tasks';

      // Earliest first
      let items = getItemsForDate(dateText);
      items.sort(function (a, b) {
        return a.start - b.start;
      });

      for (let item of items) {
        let color = getTaskColor(item.task);

        let row = document.createElement('div');
        row.className = 'month-task';
        row.style.background = colorWithOpacity(color, 0.14);

        let dot = document.createElement('span');
        dot.className = 'month-task-dot';
        dot.style.background = color;

        let text = document.createElement('span');
        text.className = 'month-task-text';
        text.textContent = minutesToShortTime(item.start) + ' ' + item.task.title;

        row.appendChild(dot);
        row.appendChild(text);
        taskArea.appendChild(row);
      }

      cell.appendChild(number);
      cell.appendChild(taskArea);

      // Clicking a day opens it in day view
      cell.addEventListener('click', function () {
        appData.currentDate = dateText;
        appData.view = 'day';
        saveData();
        showEverything();
      });

      return cell;
    }

    // If a day has more tasks than fit in its box, keep the first few and add "+3 more"
    function hideTasksThatDontFit() {
      let taskAreas = document.querySelectorAll('.month-cell-tasks');

      for (let taskArea of taskAreas) {
        let rows = taskArea.querySelectorAll('.month-task');
        if (rows.length === 0) {
          continue;
        }

        let rowHeight = rows[0].offsetHeight + 2; // +2 for the gap between rows
        let howManyFit = Math.floor(taskArea.clientHeight / rowHeight);

        if (rows.length > howManyFit && howManyFit >= 1) {
          // Keep one less than what fits, so there is room for the "+3 more" line
          let howManyToKeep = howManyFit - 1;

          for (let i = howManyToKeep; i < rows.length; i++) {
            rows[i].remove();
          }

          let more = document.createElement('div');
          more.className = 'month-more';
          more.textContent = '+' + (rows.length - howManyToKeep) + ' more';
          taskArea.appendChild(more);
        }
      }
    }


    // =========================================================
    // DRAGGING A BLOCK THAT IS ALREADY ON THE CALENDAR
    //
    // mode can be:
    //   'move'          -> drag the whole block (and to another day in week view)
    //   'resize-top'    -> drag the top edge to change the start time
    //   'resize-bottom' -> drag the bottom edge to change the end time
    // =========================================================
    function startDraggingBlock(event, item, block, mode, dayCount) {
      event.preventDefault();   // stops the browser from selecting text while dragging
      event.stopPropagation();  // stops this press from also reaching the block underneath

      // "Pointer capture" means the block keeps getting mouse moves
      // even when the mouse goes outside of it
      block.setPointerCapture(event.pointerId);
      block.classList.add('dragging');

      // Remember where things were when the drag started
      let startMouseY = event.clientY;
      let originalStart = item.start;
      let originalDur = item.dur;
      let originalDayIndex = item.dayIndex;

      let earliestTime = FIRST_HOUR * 60;
      let latestTime = LAST_HOUR * 60;

      // These change while dragging
      let newStart = originalStart;
      let newDur = originalDur;
      let newDayIndex = originalDayIndex;

      function onMouseMove(moveEvent) {
        // How far the mouse moved up or down, turned into minutes and snapped to 15
        let pixelsMoved = moveEvent.clientY - startMouseY;
        let minutesMoved = roundToSnap(pixelsMoved / PIXELS_PER_HOUR * 60);

        if (mode === 'move') {
          newStart = keepBetween(originalStart + minutesMoved, earliestTime, latestTime - originalDur);
          newDur = originalDur;

          // In week view you can also drag to another day
          if (dayCount > 1) {
            let dayUnderMouse = getDayIndexAtMouse(moveEvent.clientX, dayCount);
            if (dayUnderMouse !== newDayIndex) {
              newDayIndex = dayUnderMouse;
              item.dayIndex = newDayIndex;
              item.column = 0;       // while dragging, use the full width of the day
              item.columnCount = 1;
              setBlockSideways(block, item, dayCount);
            }
          }

        } else if (mode === 'resize-top') {
          // The end time stays the same, only the start moves
          let endTime = originalStart + originalDur;
          newStart = keepBetween(originalStart + minutesMoved, earliestTime, endTime - SNAP_MINUTES);
          newDur = endTime - newStart;

        } else if (mode === 'resize-bottom') {
          // The start time stays the same, only the end moves
          newStart = originalStart;
          newDur = keepBetween(originalDur + minutesMoved, SNAP_MINUTES, latestTime - originalStart);
        }

        setBlockTimes(block, newStart, newDur, dayCount);
      }

      function onMouseUp() {
        block.removeEventListener('pointermove', onMouseMove);
        block.removeEventListener('pointerup', onMouseUp);
        block.removeEventListener('pointercancel', onMouseUp);
        block.classList.remove('dragging');

        // Only save if something actually changed
        let somethingChanged = newStart !== originalStart || newDur !== originalDur || newDayIndex !== originalDayIndex;
        if (somethingChanged) {
          let days = getVisibleDays();
          saveItemChange(item, newStart, newDur, days[newDayIndex]);
          showEverything();
        }
      }

      block.addEventListener('pointermove', onMouseMove);
      block.addEventListener('pointerup', onMouseUp);
      block.addEventListener('pointercancel', onMouseUp); // happens if the browser interrupts the drag
    }

    // Which day column the mouse is over (0 = first day)
    function getDayIndexAtMouse(mouseX, dayCount) {
      let box = document.getElementById('day-columns').getBoundingClientRect();
      let dayWidth = box.width / dayCount;
      let index = Math.floor((mouseX - box.left) / dayWidth);
      return keepBetween(index, 0, dayCount - 1);
    }


    // =========================================================
    // DRAGGING A TASK FROM THE SIDEBAR ONTO THE CALENDAR
    // =========================================================
    function startDraggingTask(event, task, card) {
      // Clicking the ✓ or × buttons should not start a drag
      if (event.target.tagName === 'BUTTON') {
        return;
      }
      event.preventDefault();

      let startX = event.clientX;
      let startY = event.clientY;
      let preview = null; // the box that follows the mouse. We only make it once the mouse moves.

      function onMouseMove(moveEvent) {
        // Wait until the mouse moves more than 4 pixels, so a normal click isn't a drag
        if (preview === null) {
          let distanceX = moveEvent.clientX - startX;
          let distanceY = moveEvent.clientY - startY;
          let distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

          if (distance > 4) {
            preview = makeDragPreview(task, card);
            card.style.opacity = '0.4';
          }
        }

        // Move the preview box with the mouse
        if (preview !== null) {
          preview.style.left = (moveEvent.clientX - 14) + 'px';
          preview.style.top = (moveEvent.clientY - 16) + 'px';
        }
      }

      function onMouseUp(upEvent) {
        document.removeEventListener('pointermove', onMouseMove);
        document.removeEventListener('pointerup', onMouseUp);
        card.style.opacity = '';

        // No preview means the mouse never really moved, so it was just a click
        if (preview === null) {
          return;
        }
        preview.remove();

        if (appData.view === 'month') {
          dropTaskOnMonthView(task, upEvent.clientX, upEvent.clientY);
        } else {
          dropTaskOnTimeView(task, upEvent.clientX, upEvent.clientY);
        }
      }

      // Listen on the whole page, because the mouse will leave the card
      document.addEventListener('pointermove', onMouseMove);
      document.addEventListener('pointerup', onMouseUp);
    }

    // The colored box that follows the mouse while dragging
    function makeDragPreview(task, card) {
      let color = getTaskColor(task);

      let preview = document.createElement('div');
      preview.id = 'drag-preview';
      preview.textContent = task.title;
      preview.style.background = colorWithOpacity(color, 0.22);
      preview.style.borderColor = colorWithOpacity(color, 0.4);
      preview.style.borderLeftColor = color;
      preview.style.width = Math.min(card.offsetWidth, 230) + 'px';

      document.body.appendChild(preview);
      return preview;
    }

    function dropTaskOnMonthView(task, mouseX, mouseY) {
      // Find the day box under the mouse
      let elementUnderMouse = document.elementFromPoint(mouseX, mouseY);
      if (!elementUnderMouse) {
        return;
      }
      let cell = elementUnderMouse.closest('.month-cell');
      if (!cell) {
        return; // dropped somewhere that isn't a day
      }

      let dateText = cell.dataset.date;
      placeTask(task, dateText, findFreeTime(dateText, task.duration));
    }

    function dropTaskOnTimeView(task, mouseX, mouseY) {
      let box = document.getElementById('day-columns').getBoundingClientRect();

      // Ignore drops outside the calendar
      if (mouseX < box.left || mouseX > box.right || mouseY < box.top || mouseY > box.bottom) {
        return;
      }

      let days = getVisibleDays();
      let dateText = days[getDayIndexAtMouse(mouseX, days.length)];

      // Turn the mouse height into a time
      let minutes = FIRST_HOUR * 60 + (mouseY - box.top) / PIXELS_PER_HOUR * 60;
      minutes = roundToSnap(minutes);
      minutes = keepBetween(minutes, FIRST_HOUR * 60, LAST_HOUR * 60 - task.duration);

      placeTask(task, dateText, minutes);
    }


    // =========================================================
    // THE "ADD TASK" FORM
    // =========================================================

    // Color buttons: give each one its color, and select it when clicked
    let colorButtons = document.querySelectorAll('.color-button');
    for (let button of colorButtons) {
      let colorName = button.dataset.color;
      button.style.background = COLORS[colorName];

      button.addEventListener('click', function () {
        selectedColor = colorName;
        for (let otherButton of colorButtons) {
          setButtonSelected(otherButton, otherButton === button);
        }
      });
    }

    // Repeat day buttons: turn on and off when clicked
    let repeatDayButtons = document.querySelectorAll('.repeat-day-button');
    for (let button of repeatDayButtons) {
      button.addEventListener('click', function () {
        let isOn = button.getAttribute('aria-pressed') === 'true';
        setButtonSelected(button, !isOn);
      });
    }

    // Gives back the days that are turned on, like ['mon', 'wed', 'fri']
    function getSelectedRepeatDays() {
      let days = [];
      for (let button of repeatDayButtons) {
        if (button.getAttribute('aria-pressed') === 'true') {
          days.push(button.dataset.day);
        }
      }
      return days;
    }

    function addTask() {
      let titleInput = document.getElementById('title-input');
      let title = titleInput.value.trim();

      // Don't add a task with no name
      if (title === '') {
        titleInput.focus();
        return;
      }

      let minutes = parseInt(document.getElementById('minutes-input').value);
      if (!minutes) {
        minutes = 60; // empty box or not a number
      }
      if (minutes < 5) {
        minutes = 5;
      }

      let newTask = {
        id: makeId(),
        title: title,
        duration: minutes,
        color: selectedColor
      };

      // Only make it repeat if the "Repeat weekly" section is open and at least one day is picked
      let repeatSection = document.getElementById('repeat-section');
      let repeatDays = getSelectedRepeatDays();
      if (repeatSection.open && repeatDays.length > 0) {
        let startTime = document.getElementById('start-time-input').value;
        if (!startTime) {
          startTime = '10:00';
        }
        newTask.repeat = { days: repeatDays, at: startTime };
      }

      appData.tasks.push(newTask);
      saveData();
      showEverything();

      // Clear the box so the next task can be typed right away
      titleInput.value = '';
      titleInput.focus();
    }

    document.getElementById('add-button').addEventListener('click', addTask);

    // Pressing Enter in the title box also adds the task
    document.getElementById('title-input').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        addTask();
      }
    });


    // =========================================================
    // MOVING AROUND (previous, next, today, changing views)
    // =========================================================

    // direction is 1 for forward and -1 for back
    function goForwardOrBack(direction) {
      if (appData.view === 'day') {
        appData.currentDate = addDaysToDate(appData.currentDate, direction);
      } else if (appData.view === 'week') {
        appData.currentDate = addDaysToDate(appData.currentDate, direction * 7);
      } else {
        // Month view. Go to the 1st first, so going from Jan 31 to "Feb 31" doesn't skip March.
        let date = textToDate(appData.currentDate);
        date.setDate(1);
        date.setMonth(date.getMonth() + direction);
        appData.currentDate = dateToText(date);
      }

      saveData();
      showEverything();
      playSlideAnimation(direction);
    }

    // A small slide to the side when you change dates
    function playSlideAnimation(direction) {
      if (WANTS_LESS_MOTION) {
        return;
      }

      let element;
      if (appData.view === 'month') {
        element = document.getElementById('month-grid');
      } else {
        element = document.getElementById('time-grid');
      }

      element.animate(
        [
          { transform: 'translateX(' + (direction * 24) + 'px)', opacity: 0.45 },
          { transform: 'none', opacity: 1 }
        ],
        { duration: 190, easing: 'cubic-bezier(.22, .61, .36, 1)' }
      );
    }

    function goToToday() {
      appData.currentDate = getTodayText();
      saveData();
      showEverything();
    }

    function changeView(newView) {
      appData.view = newView;
      saveData();
      showEverything();
      if (newView !== 'month') {
        scrollToMorning();
      }
    }

    // Scroll the calendar so 8 AM is near the top
    function scrollToMorning() {
      let scrollAmount = (8 - FIRST_HOUR) * PIXELS_PER_HOUR - 16;
      document.getElementById('time-scroll').scrollTop = Math.max(0, scrollAmount);
    }

    document.getElementById('previous-button').addEventListener('click', function () {
      goForwardOrBack(-1);
    });

    document.getElementById('next-button').addEventListener('click', function () {
      goForwardOrBack(1);
    });

    document.getElementById('today-button').addEventListener('click', goToToday);

    document.getElementById('day-view-button').addEventListener('click', function () {
      changeView('day');
    });

    document.getElementById('week-view-button').addEventListener('click', function () {
      changeView('week');
    });

    document.getElementById('month-view-button').addEventListener('click', function () {
      changeView('month');
    });

    // Keyboard shortcuts
    //   ← and → : previous and next
    //   d, w, m : day, week, month view
    //   t       : today
    document.addEventListener('keydown', function (event) {
      // Don't use shortcuts while the person is typing in a box
      let tag = event.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
        return;
      }

      if (event.key === 'ArrowLeft') {
        goForwardOrBack(-1);
      } else if (event.key === 'ArrowRight') {
        goForwardOrBack(1);
      } else if (event.key === 'd') {
        changeView('day');
      } else if (event.key === 'w') {
        changeView('week');
      } else if (event.key === 'm') {
        changeView('month');
      } else if (event.key === 't') {
        goToToday();
      }
    });

    // Swiping sideways on a trackpad goes to the previous or next page
    let swipeAmount = 0;        // how far the person has swiped so far
    let swipeLocked = false;    // stops one swipe from changing pages many times
    let swipeResetTimer = null;

    document.getElementById('calendar-area').addEventListener('wheel', function (event) {
      // Only care about sideways scrolling
      if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) {
        return;
      }
      event.preventDefault(); // stop the browser's own back/forward swipe

      // If the swiping stops for a moment, start counting from zero again
      clearTimeout(swipeResetTimer);
      swipeResetTimer = setTimeout(function () {
        swipeAmount = 0;
      }, 180);

      if (swipeLocked) {
        return;
      }

      swipeAmount = swipeAmount + event.deltaX;

      if (Math.abs(swipeAmount) > 60) {
        if (swipeAmount > 0) {
          goForwardOrBack(1);
        } else {
          goForwardOrBack(-1);
        }
        swipeAmount = 0;

        // Wait a bit before another swipe can count
        swipeLocked = true;
        setTimeout(function () {
          swipeLocked = false;
        }, 320);
      }
    }, { passive: false }); // passive: false is needed so preventDefault() works


    // =========================================================
    // IMPORTING TASKS FROM A .JSON FILE
    //
    // The file can be a list of tasks:
    //   [ { "title": "Gym", "duration": 60, "color": "green" } ]
    // or an object with a "tasks" list (like a backup file):
    //   { "tasks": [ ... ] }
    // =========================================================
    function importTasksFromText(text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (error) {
        showMessage("That file isn't valid JSON.");
        return;
      }

      let taskList;
      if (Array.isArray(data)) {
        taskList = data;
      } else if (data && Array.isArray(data.tasks)) {
        taskList = data.tasks;
      } else {
        showMessage('No tasks found in that file.');
        return;
      }

      let importedCount = 0;

      for (let item of taskList) {
        // Skip anything without a title
        if (!item || !item.title) {
          continue;
        }

        let duration = parseInt(item.duration);
        if (!duration) {
          duration = 60;
        }
        if (duration < 5) {
          duration = 5;
        }

        let color = 'slate';
        if (isKnownColor(item.color)) {
          color = item.color;
        }

        // Every imported task gets a new id, so it can't clash with one we already have
        let newTask = {
          id: makeId(),
          title: String(item.title),
          duration: duration,
          color: color
        };

        if (item.due) {
          newTask.due = item.due;
        }

        if (item.repeat && Array.isArray(item.repeat.days)) {
          // Only keep real day names like 'mon'
          let goodDays = [];
          for (let day of item.repeat.days) {
            if (DAY_KEYS.includes(day)) {
              goodDays.push(day);
            }
          }

          if (goodDays.length > 0) {
            newTask.repeat = {
              days: goodDays,
              at: item.repeat.at || '09:00',
              from: item.repeat.from || null,
              until: item.repeat.until || null
            };
          }
        }

        appData.tasks.push(newTask);
        importedCount = importedCount + 1;
      }

      saveData();
      showEverything();

      if (importedCount === 0) {
        showMessage('Nothing to import from that file.');
      } else if (importedCount === 1) {
        showMessage('Imported 1 task.');
      } else {
        showMessage('Imported ' + importedCount + ' tasks.');
      }
    }

    // "Import tasks" button: opens the file picker
    document.getElementById('import-button').addEventListener('click', function () {
      let fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.json,application/json';

      fileInput.addEventListener('change', function () {
        let file = fileInput.files[0];
        if (file) {
          file.text().then(importTasksFromText);
        }
      });

      fileInput.click();
    });

    // "Save backup" button: downloads all the data as a .json file
    document.getElementById('backup-button').addEventListener('click', function () {
      let jsonText = JSON.stringify(appData, null, 2); // the 2 makes the file easy to read
      let file = new Blob([jsonText], { type: 'application/json' });

      // Make a hidden download link and click it
      let link = document.createElement('a');
      link.href = URL.createObjectURL(file);
      link.download = 'planner-backup-' + getTodayText() + '.json';
      link.click();
      URL.revokeObjectURL(link.href);

      showMessage('Backup saved to Downloads.');
    });

    // Dragging a file onto the page
    let dropOverlay = document.getElementById('drop-overlay');

    // dragenter and dragleave fire for every element the file passes over,
    // so we count them to know when the file has really left the page
    let dragCounter = 0;

    window.addEventListener('dragenter', function (event) {
      // Only react to files (not dragged text or links)
      if (!event.dataTransfer || !Array.from(event.dataTransfer.types).includes('Files')) {
        return;
      }
      event.preventDefault();
      dragCounter = dragCounter + 1;
      dropOverlay.classList.add('visible');
    });

    window.addEventListener('dragover', function (event) {
      // preventDefault() here tells the browser "you're allowed to drop here"
      if (dropOverlay.classList.contains('visible')) {
        event.preventDefault();
      }
    });

    window.addEventListener('dragleave', function () {
      dragCounter = dragCounter - 1;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('visible');
      }
    });

    window.addEventListener('drop', function (event) {
      if (!dropOverlay.classList.contains('visible')) {
        return;
      }
      event.preventDefault(); // stops the browser from opening the file
      dragCounter = 0;
      dropOverlay.classList.remove('visible');

      let file = event.dataTransfer.files[0];
      if (file) {
        file.text().then(importTasksFromText);
      }
    });


    // =========================================================
    // STARTING THE APP
    // =========================================================
    let savedData = loadSavedData();

    if (savedData && savedData.tasks) {
      // Load what was saved last time
      appData.tasks = savedData.tasks;
      if (savedData.blocks) {
        appData.blocks = savedData.blocks;
      }
      if (savedData.overrides) {
        appData.overrides = savedData.overrides;
      }
      if (savedData.view === 'day' || savedData.view === 'week' || savedData.view === 'month') {
        appData.view = savedData.view;
      }
    } else {
      // First time opening the app: add a few example tasks
      appData.tasks = [
        { id: makeId(), title: 'Read the assigned chapter', duration: 45, color: 'blue' },
        { id: makeId(), title: 'Gym', duration: 60, color: 'green' },
        { id: makeId(), title: 'Email + inbox', duration: 30, color: 'slate' }
      ];
    }

    // Always start on today
    appData.currentDate = getTodayText();

    showEverything();
    scrollToMorning();

    // Redraw every minute so the red "now" line moves
    setInterval(function () {
      if (appData.view !== 'month') {
        showTimeView();
      }
    }, 60000);

    // When the window changes size, redo the month view so the "+3 more" counts are right
    window.addEventListener('resize', function () {
      if (appData.view === 'month') {
        showMonthView();
      }
    });

    if (!savingWorks) {
      showMessage('Running in preview — download the file to keep your data.');
    }
  </script>
</body>
</html>
