<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planner</title>

  <style>
    /* =========================================================
       COLORS AND SIZES
       These are CSS variables. Change a value here and it
       changes everywhere that uses it.
       ========================================================= */
    :root {
      --background: #000000;     /* page background */
      --panel: #0e0e10;          /* sidebar background */
      --box: #16161a;            /* inputs and task cards */
      --box-hover: #1d1d22;      /* inputs and cards when hovered or selected */
      --border: #232328;         /* normal lines and borders */
      --border-light: #303038;   /* borders when hovered */
      --text: #ececef;           /* main text */
      --text-dim: #8d8f97;       /* less important text */
      --text-faint: #5a5c64;     /* even less important text */
      --text-hint: #46474d;      /* hint text, like "nothing here yet" */
      --corner: 7px;             /* how rounded the corners are */
      --hour-labels-width: 52px; /* width of the "6a, 7a, 8a..." column */
    }


    /* =========================================================
       BASIC PAGE SETUP
       ========================================================= */

    /* Reset the default spacing that browsers add */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      /* makes every number the same width, so times line up nicely */
      font-variant-numeric: tabular-nums;
    }

    /* Remove the default browser look from buttons */
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    input {
      font: inherit;
      color: inherit;
    }

    /* Blue outline that shows up when you move around with the Tab key */
    :focus-visible {
      outline: 1.5px solid #6f9bf0;
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* The whole app: header on top, everything else below it */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }


    /* =========================================================
       HEADER (the bar across the top)
       ========================================================= */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      height: 56px;
      flex: none;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .logo-square {
      display: block;
      width: 9px;
      height: 9px;
      background: var(--text);
      border-radius: 2px;
    }

    /* The ‹ Today › buttons */
    .date-buttons {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .date-buttons button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: var(--text-dim);
      display: grid;
      place-items: center;
      font-size: 15px;
      line-height: 1;
    }

    .date-buttons button:hover {
      background: var(--box);
      color: var(--text);
    }

    #today-button {
      width: auto;
      padding: 0 11px;
      font-size: 13px;
    }

    /* The big date text, like "Sep 27 – Oct 3" */
    .date-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    #date-label {
      font-weight: 500;
      font-size: 15px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    #date-sublabel {
      color: var(--text-faint);
      font-size: 13px;
      white-space: nowrap;
    }

    /* Empty space that pushes the next items to the right side */
    .spacer {
      flex: 1;
    }

    /* The Day / Week / Month switcher */
    .view-switcher {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .view-switcher button {
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .view-switcher button:hover {
      color: var(--text);
    }

    /* aria-pressed="true" means this is the selected button */
    .view-switcher button[aria-pressed="true"] {
      background: var(--box-hover);
      color: var(--text);
    }

    /* "Import tasks" and "Save backup" */
    .header-button {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .header-button:hover {
      background: var(--box);
      color: var(--text);
      border-color: var(--border-light);
    }


    /* =========================================================
       MAIN AREA (sidebar on the left, calendar on the right)
       ========================================================= */
    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }


    /* =========================================================
       SIDEBAR
       ========================================================= */
    .sidebar {
      width: 284px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }

    /* The "add a new task" area at the top of the sidebar */
    .new-task-area {
      flex: none;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    #title-input {
      width: 100%;
      padding: 9px 11px;
      font-size: 13.5px;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: var(--corner);
    }

    #title-input::placeholder {
      color: var(--text-faint);
    }

    #title-input:focus {
      outline: none;
      background: var(--box-hover);
      border-color: var(--border-light);
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
    }

    #minutes-input {
      width: 74px;
      padding: 8px 9px;
      font-size: 13px;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: var(--corner);
    }

    /* The row of colored circles */
    .color-picker {
      display: flex;
      gap: 5px;
      flex: 1;
    }

    .color-button {
      width: 17px;
      height: 17px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
      cursor: pointer;
    }

    .color-button[aria-pressed="true"] {
      border-color: var(--text);
    }

    .add-button {
      width: 100%;
      margin-top: 9px;
      padding: 8px;
      font-size: 13px;
      background: var(--box-hover);
      border: 1px solid var(--border-light);
      border-radius: var(--corner);
    }

    .add-button:hover {
      background: #26262d;
    }

    /* The "Repeat weekly" section that opens and closes */
    .repeat-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .repeat-section summary {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-faint);
      cursor: pointer;
      user-select: none;
      list-style: none; /* hides the default triangle */
    }

    /* Hides the default triangle in Safari */
    .repeat-section summary::-webkit-details-marker {
      display: none;
    }

    /* Show a "+" when closed... */
    .repeat-section summary::before {
      content: "+";
      width: 11px;
      color: var(--text-faint);
    }

    /* ...and a "−" when open */
    .repeat-section[open] summary::before {
      content: "−";
    }

    .repeat-section summary:hover {
      color: var(--text-dim);
    }

    /* The S M T W T F S buttons */
    .repeat-days {
      display: flex;
      gap: 4px;
      margin-top: 9px;
    }

    .repeat-day-button {
      flex: 1;
      padding: 6px 0;
      font-size: 11.5px;
      color: var(--text-faint);
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .repeat-day-button[aria-pressed="true"] {
      color: var(--text);
      background: var(--box-hover);
      border-color: var(--border-light);
    }

    .time-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }

    .time-row label {
      flex: none;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    #start-time-input {
      flex: 1;
      padding: 7px 9px;
      font-size: 13px;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: var(--corner);
    }

    /* The list of tasks below the form */
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 40px;
    }

    /* "Tasks 3" and "Repeating 1" headings */
    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 14px 0 8px;
      font-size: 12px;
      color: var(--text-faint);
    }

    .list-heading:first-child {
      margin-top: 0;
    }

    .list-count {
      color: var(--text-hint);
    }

    .empty-message {
      padding: 8px 2px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-hint);
    }

    /* One task in the sidebar list */
    .task-card {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 10px;
      margin-bottom: 5px;
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: var(--corner);
      cursor: grab;
      user-select: none;
      touch-action: none; /* lets you drag it on a phone or tablet */
    }

    .task-card:hover {
      background: var(--box-hover);
      border-color: var(--border-light);
    }

    /* Finished tasks are faded and crossed out */
    .task-card.done {
      opacity: 0.38;
    }

    .task-card.done .task-title {
      text-decoration: line-through;
    }

    .task-dot {
      flex: none;
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 50%;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 13.5px;
      line-height: 1.35;
      word-break: break-word;
    }

    .task-details {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--text-faint);
    }

    /* The ✓ and × buttons. Hidden until you hover the task. */
    .task-buttons {
      display: flex;
      gap: 3px;
      flex: none;
      opacity: 0;
    }

    .task-card:hover .task-buttons {
      opacity: 1;
    }

    .task-buttons button {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      color: var(--text-faint);
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
    }

    .task-buttons button:hover {
      background: #2c2c34;
      color: var(--text);
    }


    /* =========================================================
       CALENDAR AREA (right side)
       ========================================================= */
    #calendar-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }


    /* =========================================================
       DAY AND WEEK VIEW
       ========================================================= */
    #time-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* The row of day names at the top (only shown in week view) */
    #day-headers {
      display: flex;
      height: 50px;
      flex: none;
      padding-left: var(--hour-labels-width);
      border-bottom: 1px solid var(--border);
    }

    .day-header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      border-left: 1px solid var(--border);
    }

    .day-header:first-child {
      border-left: none;
    }

    .day-header:hover {
      background: var(--panel);
    }

    .day-name {
      font-size: 11px;
      color: var(--text-faint);
    }

    .day-number {
      font-size: 15px;
      line-height: 1.3;
    }

    /* Today's date gets a white circle */
    .day-header.today .day-number {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--text);
      color: #000000;
      font-size: 12.5px;
      font-weight: 500;
    }

    /* The part that scrolls up and down */
    #time-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    #time-grid {
      display: flex;
      position: relative;
    }

    /* The "6a, 7a, 8a..." column on the left */
    #hour-labels {
      width: var(--hour-labels-width);
      flex: none;
      position: relative;
    }

    .hour-label {
      position: absolute;
      right: 8px;
      font-size: 11px;
      color: var(--text-faint);
      transform: translateY(-6px); /* moves the text up so it sits on the line */
    }

    /* The area where the task blocks go */
    #day-columns {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    /* Lines across the grid for every hour */
    .hour-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid var(--border);
      pointer-events: none; /* so the line doesn't block mouse clicks */
    }

    /* Darker lines for every half hour */
    .hour-line.half-hour {
      border-top-color: #141418;
    }

    /* Up-and-down lines between the days */
    .day-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      border-left: 1px solid var(--border);
      pointer-events: none;
    }

    /* The red line that shows the current time */
    #now-line {
      position: absolute;
      height: 1px;
      background: #e05c5c;
      z-index: 6;
      pointer-events: none;
    }

    /* The red dot at the left end of the "now" line */
    #now-line::before {
      content: "";
      position: absolute;
      left: -4px;
      top: -3.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e05c5c;
    }

    /* A task that has been placed on the calendar */
    .block {
      position: absolute;
      z-index: 3;
      padding: 4px 8px;
      overflow: hidden;
      border: 1px solid;
      border-left-width: 2.5px;
      border-radius: var(--corner);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .block:hover {
      z-index: 5;
    }

    .block.dragging {
      z-index: 10;
      cursor: grabbing;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6);
    }

    .block-title {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* adds "..." if the title is too long */
    }

    .block-time {
      margin-top: 1px;
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
    }

    /* Short blocks put the title and time on one line */
    .block.short {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 8px;
    }

    .block.short .block-time {
      margin-top: 0;
    }

    /* Invisible strips at the top and bottom of a block that you drag to resize it */
    .resize-handle {
      position: absolute;
      left: 0;
      right: 0;
      height: 9px;
      cursor: ns-resize;
    }

    .resize-handle.top {
      top: -1px;
    }

    .resize-handle.bottom {
      bottom: -1px;
    }

    /* The × button on a block. Hidden until you hover the block. */
    .block-delete {
      position: absolute;
      top: 2px;
      right: 3px;
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
      color: var(--text-dim);
      opacity: 0;
    }

    .block:hover .block-delete {
      opacity: 1;
    }

    .block-delete:hover {
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
    }


    /* =========================================================
       MONTH VIEW
       ========================================================= */
    #month-view {
      flex: 1;
      display: none; /* hidden at first. The script shows it when needed. */
      flex-direction: column;
      min-height: 0;
    }

    /* The row with Sun, Mon, Tue... */
    #month-day-names {
      display: flex;
      height: 28px;
      flex: none;
      border-bottom: 1px solid var(--border);
    }

    #month-day-names div {
      flex: 1;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: var(--text-faint);
    }

    /* 7 columns, one for each day of the week */
    #month-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      min-height: 0;
    }

    /* One day box in the month view */
    .month-cell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 5px 6px;
      overflow: hidden;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    /* The last box in each row doesn't need a right border */
    .month-cell:nth-child(7n) {
      border-right: none;
    }

    /* Days from the month before or after are faded */
    .month-cell.other-month {
      opacity: 0.3;
    }

    .month-cell:hover {
      background: var(--panel);
    }

    .month-day-number {
      flex: none;
      align-self: flex-start;
      margin-bottom: 4px;
      padding: 0 2px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .month-cell.today .month-day-number {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 50%;
      background: var(--text);
      color: #000000;
      font-size: 11px;
      font-weight: 500;
    }

    .month-cell-tasks {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    /* One task inside a month day box */
    .month-task {
      flex: none;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 1px 5px;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      border-radius: 3px;
    }

    .month-task-dot {
      flex: none;
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .month-task-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* "+2 more" when there isn't room for every task */
    .month-more {
      flex: none;
      padding-left: 6px;
      font-size: 10.5px;
      color: var(--text-faint);
    }


    /* =========================================================
       POPUPS AND OVERLAYS
       ========================================================= */

    /* The box that follows your mouse while you drag a task from the sidebar */
    #drag-preview {
      position: fixed;
      z-index: 99;
      padding: 7px 11px;
      font-size: 13px;
      border: 1px solid;
      border-left-width: 2.5px;
      border-radius: var(--corner);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65);
      pointer-events: none;
    }

    /* The dark screen that shows up when you drag a file over the page */
    #drop-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      display: none; /* hidden until a file is dragged in */
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.86);
    }

    #drop-overlay.visible {
      display: grid;
    }

    .drop-box {
      padding: 44px 56px;
      border: 1.5px dashed var(--border-light);
      border-radius: 14px;
    }

    .drop-title {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
      font-weight: 500;
    }

    .drop-subtitle {
      font-size: 13px;
      color: var(--text-faint);
    }

    /* The little message that pops up at the bottom, like "Imported 3 tasks." */
    #popup-message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      z-index: 150;
      padding: 9px 15px;
      font-size: 13px;
      background: var(--box-hover);
      border: 1px solid var(--border-light);
      border-radius: var(--corner);
      pointer-events: none;
      /* starts invisible and a bit lower */
      opacity: 0;
      transform: translate(-50%, 14px);
      transition: opacity 0.18s, transform 0.18s;
    }

    #popup-message.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Turn off the animation for people who asked their computer for less motion */
    @media (prefers-reduced-motion: reduce) {
      #popup-message {
        transition: none;
      }
    }


    /* =========================================================
       SCROLLBARS (Chrome, Edge and Safari only)
       ========================================================= */
    ::-webkit-scrollbar {
      width: 9px;
    }

    ::-webkit-scrollbar-thumb {
      background: #25252b;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #32323a;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- ===================== HEADER ===================== -->
    <header>
      <span class="logo">
        <span class="logo-square"></span>
        Planner
      </span>

      <div class="date-buttons">
        <button id="previous-button" aria-label="Previous">‹</button>
        <button id="today-button">Today</button>
        <button id="next-button" aria-label="Next">›</button>
      </div>

      <!-- The script fills these in with the current date -->
      <div class="date-title">
        <span id="date-label"></span>
        <span id="date-sublabel"></span>
      </div>

      <div class="spacer"></div>

      <div class="view-switcher">
        <button id="day-view-button">Day</button>
        <button id="week-view-button">Week</button>
        <button id="month-view-button">Month</button>
      </div>

      <button class="header-button" id="import-button">Import tasks</button>
      <button class="header-button" id="backup-button">Save backup</button>
    </header>


    <main>

      <!-- ===================== SIDEBAR ===================== -->
      <aside class="sidebar">

        <!-- The form for adding a new task -->
        <div class="new-task-area">

              <button class="color-button" data-color="amber" title="amber" aria-pressed="false"></button>
              <button class="color-button" data-color="rose" title="rose" aria-pressed="false"></button>
              <button class="color-button" data-color="purple" title="purple" aria-pressed="false"></button>
              <button class="color-button" data-color="slate" title="slate" aria-pressed="false"></button>

          <details class="repeat-section" id="repeat-section">
            <summary>Repeat weekly</summary>

            <div class="repeat-days">
              <button class="repeat-day-button" data-day="sun" title="sun" aria-pressed="false">S</button>
              <button class="repeat-day-button" data-day="mon" title="mon" aria-pressed="true">M</button>
              <button class="repeat-day-button" data-day="tue" title="tue" aria-pressed="false">T</button>
              <button class="repeat-day-button" data-day="wed" title="wed" aria-pressed="true">W</button>
              <button class="repeat-day-button" data-day="thu" title="thu" aria-pressed="false">T</button>
              <button class="repeat-day-button" data-day="fri" title="fri" aria-pressed="true">F</button>
              <button class="repeat-day-button" data-day="sat" title="sat" aria-pressed="false">S</button>
            </div>

            <div class="time-row">
              <label for="start-time-input">Starts at</label>
              <input type="time" id="start-time-input" value="10:00">

          <button class="add-button" id="add-button">Add task</button>
        </div>

        <!-- The script fills this with the list of tasks -->
        <div class="task-list" id="task-list"></div>

      <!-- ===================== CALENDAR ===================== -->
      <div id="calendar-area">

        <!-- Day view and week view both use this -->
        <div id="time-view">
          <div id="day-headers"></div>
          <div id="time-scroll">
            <div id="time-grid">
              <div id="hour-labels"></div>
              <div id="day-columns"></div>

          </div>
        </div>

        <!-- Month view -->
        <div id="month-view">
          <div id="month-day-names">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>

          <div id="month-grid"></div>
